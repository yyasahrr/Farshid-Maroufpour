version: "3.9"

# Local PostgreSQL for the salon backend.
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Reset:   docker compose down -v   # also wipes the data volume
#
# The connection string used by the app is:
#   postgresql://postgres@127.0.0.1:5434/app_db
# (port 5434 avoids clashing with a host Postgres on 5432)

services:
  db:
    image: postgres:16-alpine
    container_name: salon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro

volumes:
  db-data: